<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esat Gözütok</title>
<meta name="description" content="Esat Gözütok — Software Engineering Student at Bahçeşehir University.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1d2f;--paper:#fff6e9;--cream:#ffe9c7;
  --pink:#ff7aa8;--pink-d:#d94f80;--mint:#5fe0c4;--mint-d:#2fa892;
  --sky:#7ec8ff;--sky-d:#4b8fe0;--sun:#ffd23f;--sun-d:#e0a400;
  --grape:#8b6cff;--grape-d:#5f43d6;--grass:#6ad14f;--night:#2a2350;--px:4px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Pixelify Sans",system-ui,sans-serif;font-size:19px;line-height:1.5;overflow-x:hidden;
  cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' shape-rendering='crispEdges'><path d='M2 2h3v3H2zM5 5h3v3H5zM8 8h3v3H8zM11 11h3v3h-3zM2 5h3v9H2zM5 14h3v-3H5zM2 2h9v3H2z' fill='%232b1d2f'/><path d='M5 5h3v3H5zM5 8h3v3H5z' fill='%23ff7aa8'/></svg>") 2 2, auto;
}
canvas.sprite{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
h1,h2,h3,.pixel{font-family:"Press Start 2P",monospace;font-weight:400;letter-spacing:.02em}
a{color:inherit}
::selection{background:var(--pink);color:#fff}

.box{background:#fff;position:relative;margin:var(--px);
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 12px 0 0 rgba(43,29,47,.25)}
.btn{font-family:"Press Start 2P",monospace;font-size:12px;display:inline-flex;align-items:center;gap:10px;
  padding:14px 18px;border:0;color:var(--ink);background:var(--sun);cursor:pointer;text-decoration:none;position:relative;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset -4px -4px 0 0 var(--sun-d),inset 4px 4px 0 0 #fff3a8;
  transition:transform .08s}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(2px)}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset -4px -4px 0 0 var(--pink-d),inset 4px 4px 0 0 #ffb3cd}
.btn.mint{background:var(--mint);box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset -4px -4px 0 0 var(--mint-d),inset 4px 4px 0 0 #b5fff0}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;background:var(--ink);color:#fff;font-family:"Press Start 2P",monospace;font-size:10px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.hud .left,.hud .right{display:flex;align-items:center;gap:14px}
.hud .hearts{display:flex;gap:4px}
.hud nav{display:flex;gap:2px}
.hud nav a{text-decoration:none;padding:6px 7px;color:#fff;white-space:nowrap}
.hud nav a:hover{background:var(--pink)}
.prog{width:110px;height:12px;background:#4a3a52;position:relative;box-shadow:0 0 0 2px #fff}
.prog i{position:absolute;inset:0;width:0;background:repeating-linear-gradient(90deg,var(--mint) 0 6px,var(--mint-d) 6px 8px)}
.coins{display:flex;align-items:center;gap:6px}
.coins.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.35)}}
.lang{display:flex;box-shadow:0 0 0 2px #fff}
.lang button{font-family:"Press Start 2P";font-size:9px;border:0;padding:6px 8px;background:transparent;color:#fff;cursor:pointer}
.lang button.on{background:var(--sun);color:var(--ink)}
.snd{font-family:"Press Start 2P";font-size:9px;border:0;padding:6px 8px;background:var(--mint);color:var(--ink);cursor:pointer;box-shadow:0 0 0 2px #fff;white-space:nowrap}
.snd.muted{background:transparent;color:#fff;opacity:.7}
.hud.tight{gap:8px}
.hud.tight nav a{font-size:8px;padding:6px 4px}
.hud.compact nav{display:none}
.hud .right{flex-shrink:0}
@media (max-width:420px){.prog{width:60px}.hud .hearts{display:none}}

/* HERO */
.hero{position:relative;min-height:100vh;overflow:hidden;
  background:linear-gradient(#5b8ff0 0%,#7ec8ff 45%,#bfe6ff 75%,#ffe1f0 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px 16px 190px;text-align:center}
.layer{position:absolute;left:0;right:0;background-repeat:repeat-x;image-rendering:pixelated;pointer-events:none}
.clouds1{top:12%;height:96px;animation:scrollx 60s linear infinite;opacity:.95}
.clouds2{top:34%;height:64px;animation:scrollx 38s linear infinite;opacity:.8}
.hills{bottom:96px;height:128px;animation:scrollx 90s linear infinite}
.ground{bottom:0;height:100px;animation:scrollx 14s linear infinite}
@keyframes scrollx{from{background-position-x:0}to{background-position-x:-1024px}}
.sun{position:absolute;top:110px;right:9%;animation:spin 18s steps(12) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title{font-size:clamp(26px,6.4vw,64px);line-height:1.15;margin:0 0 14px;color:#fff;position:relative;z-index:3;
  text-shadow:4px 4px 0 var(--ink),-4px 4px 0 var(--ink),4px -4px 0 var(--ink),-4px -4px 0 var(--ink),0 10px 0 var(--pink-d)}
.title span{display:inline-block;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}}
.subtitle{position:relative;z-index:3;font-family:"Press Start 2P",monospace;font-size:clamp(10px,1.7vw,14px);
  background:var(--ink);color:var(--sun);padding:10px 14px;display:inline-block;margin-bottom:26px}
.teaser{position:absolute;right:16px;bottom:108px;z-index:3;font-size:13px;color:var(--ink);opacity:.55;max-width:260px;text-align:right;transition:opacity .3s}.teaser:hover{opacity:1}
.stage{position:relative;display:flex;align-items:flex-end;justify-content:center;margin:96px 0 26px;z-index:2}
.hero-sprite{cursor:pointer;animation:hop 1.1s steps(2) infinite;filter:drop-shadow(0 6px 0 rgba(43,29,47,.25))}
.hero-sprite.jump{animation:bigjump .55s cubic-bezier(.3,1.6,.6,1)}
@keyframes hop{50%{transform:translateY(-6px)}}
@keyframes bigjump{40%{transform:translateY(-70px) rotate(-8deg)}100%{transform:none}}
.bubble{position:absolute;bottom:calc(100% + 18px);left:50%;transform:translateX(-50%);background:#fff;padding:12px 14px;
  min-width:240px;max-width:min(380px,84vw);font-size:17px;text-align:left;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.bubble::after{content:"";position:absolute;top:100%;left:50%;width:12px;height:12px;background:#fff;
  box-shadow:4px 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);transform:translate(-50%,0)}
.bubble .caret{display:inline-block;width:10px;height:16px;background:var(--pink);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.drone{position:absolute;top:22%;left:-80px;animation:fly 16s linear infinite;z-index:1}
.drone canvas{animation:hop .4s steps(2) infinite}
@keyframes fly{to{transform:translateX(calc(100vw + 160px))}}
.hint{position:absolute;bottom:110px;left:0;right:0;font-family:"Press Start 2P";font-size:9px;opacity:.7;z-index:2;padding:0 16px}

/* sections */
section{padding:90px 16px;position:relative}
.wrap{max-width:1100px;margin:0 auto}
.sec-head{display:flex;align-items:center;gap:14px;margin-bottom:34px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(16px,3vw,26px);margin:0;line-height:1.4}
.num{font-family:"Press Start 2P";font-size:10px;background:var(--ink);color:#fff;padding:8px 10px}
.reveal{opacity:0;transform:translateY(30px) scale(.98);transition:opacity .5s,transform .5s cubic-bezier(.3,1.5,.6,1)}
.reveal.in{opacity:1;transform:none}
h3.sub{font-size:13px;margin:46px 0 20px;line-height:1.5}

/* about */
#about{background:var(--cream)}
.char{display:grid;grid-template-columns:300px 1fr;gap:36px;align-items:start}
@media (max-width:820px){.char{grid-template-columns:1fr}}
.portrait{padding:22px;text-align:center;background:linear-gradient(var(--grape) 0 60%,var(--grape-d) 60%)}
.portrait .frame{background:#c9bcff;display:flex;justify-content:center;padding:14px 0;margin-bottom:14px;box-shadow:inset 0 0 0 4px var(--ink)}
.portrait h3{font-size:12px;color:#fff;margin:6px 0}
.portrait .cls{font-family:"Press Start 2P";font-size:8px;color:var(--sun);line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;margin-top:16px;color:#fff;font-size:16px}
.kv b{font-family:"Press Start 2P";font-size:8px;color:#c9bcff;padding-top:5px}
.bio{padding:24px;font-size:20px}
.bio p{margin:0 0 14px}
.label{font-family:"Press Start 2P";font-size:9px;display:block;margin:20px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-family:"Press Start 2P";font-size:9px;padding:9px 10px;background:var(--mint);box-shadow:0 0 0 3px var(--ink);line-height:1.5}
.chip.p{background:var(--pink);color:#fff}.chip.y{background:var(--sun)}.chip.g{background:#c9bcff}
.chip:hover{animation:wiggle .3s steps(2) 2}

/* timeline (experience / education) */
.dark{background:var(--night);color:#fff;overflow:hidden}
.dark .num{background:var(--sun);color:var(--ink)}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:4px;height:4px;background:#fff;animation:twinkle 2s steps(2) infinite}
@keyframes twinkle{50%{opacity:.15}}
.timeline{position:relative;display:grid;gap:26px;padding-left:46px}
.timeline::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(var(--sun) 0 12px,transparent 12px 22px)}
.entry{background:#3a3170;padding:20px 22px;position:relative;color:#fff;
  box-shadow:0 -4px 0 0 #fff,0 4px 0 0 #fff,-4px 0 0 0 #fff,4px 0 0 0 #fff,0 12px 0 0 rgba(0,0,0,.3);transition:transform .15s}
.entry:hover{transform:translateX(8px)}
.entry .pin{position:absolute;left:-46px;top:16px}
.entry h3{font-size:13px;margin:0 0 6px;color:var(--sun);line-height:1.5}
.entry .role{font-size:19px;margin-bottom:6px}
.entry .meta{font-family:"Press Start 2P";font-size:9px;color:var(--mint);margin-bottom:10px;line-height:1.7}
.entry ul{margin:0;padding-left:0;list-style:none}
.entry li{padding-left:22px;position:relative;margin-bottom:4px}
.entry li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:8px;background:var(--pink)}
.badge{display:inline-block;font-family:"Press Start 2P";font-size:8px;padding:5px 7px;margin-left:8px;vertical-align:2px}
.badge.now{background:var(--pink);color:#fff;animation:blink 1.2s steps(1) infinite}
.badge.left{background:#a0a0b8;color:var(--ink)}
#education{background:#3b2f6b}
#education .entry{background:#4a3d85}

/* skills */
#skills{background:#e8f8ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.slot{background:#fff;padding:18px 16px 16px;cursor:pointer;position:relative;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset -4px -4px 0 0 #cfe6f2;transition:transform .12s}
.slot:hover{transform:translateY(-6px) rotate(-1deg);background:#fffbe0}
.slot .ico{height:56px;display:flex;align-items:center;margin-bottom:10px}
.slot:hover .ico canvas{animation:wiggle .4s steps(2) infinite}
@keyframes wiggle{50%{transform:rotate(10deg) scale(1.1)}}
.slot h3{font-size:10px;margin:0 0 8px;line-height:1.5}
.slot p{margin:0;font-size:16px;color:#4c3d55;line-height:1.4}

/* projects */
#projects{background:var(--paper)}
.filters{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:34px}
.filters .btn{font-size:9px;padding:10px 12px;background:#fff;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.filters .btn.on{background:var(--pink);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px}
.card{position:relative;padding:0 0 18px;background:#fff;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 14px 0 0 rgba(43,29,47,.18);transition:transform .15s}
.card:hover{transform:translateY(-8px)}
.card.hide{display:none}
.card .art{height:110px;display:flex;align-items:center;justify-content:center;border-bottom:4px solid var(--ink)}
.card .art canvas{animation:hop 1.2s steps(2) infinite}
.card h3{font-size:11px;margin:16px 16px 6px;line-height:1.5}
.card .sub2{margin:0 16px 8px;font-size:15px;color:var(--pink-d)}
.card p{margin:0 16px 12px;font-size:16px;line-height:1.4;color:#4c3d55}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 16px}
.tags span{font-family:"Press Start 2P";font-size:7px;padding:5px 6px;background:#efe6ff;box-shadow:0 0 0 2px var(--ink);line-height:1.4}

/* certificates */
#certifications{background:linear-gradient(#ffe1f0,#fff6e9)}
#events{background:#fff6e9}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.cert{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--ink);color:#fff;
  box-shadow:0 -4px 0 0 var(--sun),0 4px 0 0 var(--sun),-4px 0 0 0 var(--sun),4px 0 0 0 var(--sun)}
.cert .t{font-family:"Press Start 2P";font-size:8px;color:var(--sun);margin-bottom:6px}
.cert b{display:block;font-size:17px;line-height:1.3}
.cert small{color:#c9bcff;font-size:14px}
.cert:hover canvas{animation:wiggle .35s steps(2) infinite}
.panel{padding:22px}
.panel h4{font-family:"Press Start 2P";font-size:11px;margin:0 0 4px;line-height:1.6;font-weight:400}
.panel ul{margin:12px 0 0;padding-left:20px}
.ev{display:flex;gap:14px;padding:8px 0;border-bottom:4px dotted #e6d8ea;font-size:18px}
.ev:last-child{border:0}
.ev em{font-style:normal;font-family:"Press Start 2P";font-size:10px;background:var(--sun);padding:6px 7px;height:fit-content;white-space:nowrap;min-width:58px;text-align:center}

/* contact */
#contact{background:var(--night);color:#fff;text-align:center;overflow:hidden;padding-bottom:160px}
#contact h2{color:var(--sun);font-size:clamp(18px,4vw,34px);line-height:1.4;margin:0 0 18px}
#contact p{max-width:560px;margin:0 auto 28px;font-size:20px}
.save{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;margin-bottom:34px}
.campfire{display:flex;justify-content:center;margin:26px 0 10px}
#contact .chips{justify-content:center;max-width:820px;margin:0 auto}
#contact .chip{color:var(--ink)}
#contact .label{color:#c9bcff}
footer .secret{color:#5a4a7a;font-family:"Pixelify Sans";font-size:15px;transition:color .3s}footer .secret:hover{color:var(--sun)}
footer{background:var(--ink);color:#c9bcff;text-align:center;padding:22px 16px;font-family:"Press Start 2P";font-size:9px;line-height:2}
.ground2{position:absolute;bottom:0;left:0;right:0;height:100px;background-repeat:repeat-x;image-rendering:pixelated;animation:scrollx 20s linear infinite}


/* music player */
.music{position:fixed;left:16px;bottom:16px;z-index:60;background:var(--ink);color:#fff;width:316px;max-width:calc(100vw - 32px);padding:8px;
  box-shadow:0 -4px 0 0 var(--pink),0 4px 0 0 var(--pink),-4px 0 0 0 var(--pink),4px 0 0 0 var(--pink),0 10px 0 0 rgba(0,0,0,.3)}
.music .mhead{display:flex;align-items:center;gap:8px;font-family:"Press Start 2P";font-size:8px;line-height:1.6}
.music .mhead .eq{display:flex;gap:2px;align-items:flex-end;height:14px}
.music .mhead .eq i{width:3px;background:var(--mint);height:4px}
.music.playing .eq i{animation:eq .5s steps(3) infinite}
.music.playing .eq i:nth-child(2){animation-delay:.15s}.music.playing .eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%{height:4px}50%{height:14px}100%{height:8px}}
.music .mtitle{flex:1;overflow:hidden;white-space:nowrap}
.music .mtitle span{display:inline-block;padding-left:100%;animation:marquee 9s linear infinite}
@keyframes marquee{to{transform:translateX(-100%)}}
.music button{font-family:"Press Start 2P";font-size:9px;border:0;background:var(--pink);color:#fff;padding:5px 6px;cursor:pointer}
.music .screen{margin-top:8px;height:80px;border-radius:12px;overflow:hidden;background:#000}
.music .screen iframe{display:block}
.music.off{visibility:hidden;pointer-events:none;transform:translateY(160%)}
.music{transition:transform .4s cubic-bezier(.3,1.5,.6,1)}
.music.min{width:auto;padding:6px 8px;cursor:pointer}
.music.min .mtitle,.music.min .tap{display:none}
.music.min .mhead{gap:10px}
.music.min .mhead .eq{height:16px}
/* keep the embed alive (music continues) but take it out of view */
.music.min .screen{position:absolute;left:0;bottom:0;width:300px;height:80px;margin:0;opacity:0;pointer-events:none;clip-path:inset(50%)}
.music .tap{font-family:"Pixelify Sans";font-size:13px;color:var(--sun);margin-top:6px}
.music.started .tap{display:none}
body.rainbow .music{box-shadow:0 -4px 0 0 var(--sun),0 4px 0 0 var(--sun),-4px 0 0 0 var(--sun),4px 0 0 0 var(--sun)}

.fx{position:fixed;pointer-events:none;z-index:99;font-family:"Press Start 2P";font-size:11px;color:var(--sun);text-shadow:2px 2px 0 var(--ink)}
body.rainbow>section,body.rainbow>footer{animation:hue 3s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

<header class="hud">
  <div class="left">
    <div class="hearts" id="hearts"></div>
    <div class="prog"><i id="prog"></i></div>
  </div>
  <nav>
    <a href="#about" data-i="nav_about"></a><a href="#education" data-i="nav_edu"></a><a href="#experience" data-i="nav_exp"></a><a href="#skills" data-i="nav_skills"></a><a href="#projects" data-i="nav_proj"></a><a href="#certifications" data-i="nav_cert"></a><a href="#events" data-i="nav_ev"></a><a href="#contact" data-i="nav_contact"></a>
  </nav>
  <div class="right">
    <button class="snd" id="sndBtn" aria-label="Mute sound" title="Sound on/off">♪ ON</button>
    <div class="lang"><button data-l="en">EN</button><button data-l="tr">TR</button></div>
    <div class="coins" id="coinBox"><span id="coinIco"></span><span id="coinNum">x00</span></div>
  </div>
</header>

<section class="hero" id="top">
  <div class="layer clouds1" id="clouds1"></div>
  <div class="layer clouds2" id="clouds2"></div>
  <div class="sun" id="sun"></div>
  <div class="drone" id="drone"></div>
  <div class="layer hills" id="hills"></div>
  <div class="layer ground" id="ground"></div>
  <div class="teaser" data-i="teaser"></div>
  <h1 class="title" id="title">ESAT GÖZÜTOK</h1>
  <div class="subtitle">★ <span data-i="role"></span> ★</div>
  <div class="stage">
    <div class="bubble"><span id="typed"></span><span class="caret"></span></div>
    <div id="heroSprite" class="hero-sprite"></div>
  </div>
  <a href="#about" class="btn pink">▶ <span data-i="cta"></span></a>
</section>

<section id="about">
  <div class="wrap">
    <div class="sec-head reveal"><span class="num">01</span><h2 data-i="nav_about"></h2></div>
    <div class="char">
      <div class="box portrait reveal">
        <div class="frame" id="portrait"></div>
        <h3>ESAT GÖZÜTOK</h3>
        <div class="cls" data-i="role"></div>
        <div class="kv" id="kv"></div>
      </div>
      <div class="box bio reveal">
        <div id="bio"></div>
        <span class="label" data-i="lbl_prog"></span>
        <div class="chips" id="progLangs"></div>
        <span class="label" data-i="lbl_lang"></span>
        <div class="chips" id="langs"></div>
      </div>
    </div>
  </div>
</section>

<section id="education" class="dark">
  <div class="stars" id="stars3"></div>
  <div class="wrap" style="position:relative">
    <div class="sec-head reveal"><span class="num">02</span><h2 data-i="nav_edu"></h2></div>
    <div class="timeline" id="edu"></div>
  </div>
</section>

function ensureCtx(){

  master=actx.createGain();master.gain.value=0;master.connect(lp);

function tone(type,freq,t,dur,vol,dest=master){
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05);
}

  if(!noiseBuf){noiseBuf=actx.createBuffer(1,actx.sampleRate*0.05,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
function scheduleStep(i,t){
  const bar=Math.floor(i/8)%4,s=i%8;
  tone('triangle',mtof(CH[bar][ARP[s]]),t,STEP*1.6,0.05);
  if(s===0||s===4)tone('triangle',mtof(ROOT[bar]),t,STEP*3.5,0.16);
  const m=MEL[i%64];if(m)tone('square',mtof(m),t,STEP*1.8,0.028);
  hat(t,s%2===1?0.03:0.012);
  if(s===2||s===6)hat(t+STEP/2,0.01);
}
function scheduler(){while(nextT<actx.currentTime+0.15){scheduleStep(step,nextT);nextT+=STEP;step=(step+1)%64;}}
function bgmUpdate(){
  if(!actx)return;
  const want=!muted&&!disco&&!document.hidden;
  if(want&&!bgmOn){bgmOn=true;actx.resume();nextT=actx.currentTime+0.05;schedTimer=setInterval(scheduler,25);
    master.gain.cancelScheduledValues(actx.currentTime);master.gain.setTargetAtTime(0.55,actx.currentTime,0.4);}
  else if(!want&&bgmOn){bgmOn=false;clearInterval(schedTimer);master.gain.cancelScheduledValues(actx.currentTime);master.gain.setTargetAtTime(0,actx.currentTime,0.1);}
}
window.coinSfx=()=>{
  if(muted||!ensureCtx())return;actx.resume();
  const t=actx.currentTime,g=actx.createGain();g.gain.value=0.07;g.connect(actx.destination);
  const o=actx.createOscillator();o.type='square';o.frequency.setValueAtTime(988,t);o.frequency.setValueAtTime(1319,t+0.07);
  const e=actx.createGain();e.gain.setValueAtTime(1,t);e.gain.setValueAtTime(1,t+0.07);e.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
  o.connect(e);e.connect(g);o.start(t);o.stop(t+0.4);
};
function firstSound(){if(ensureCtx()){actx.resume();bgmUpdate();}}
['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,firstSound,{once:true,passive:true}));
document.addEventListener('visibilitychange',bgmUpdate);
$('sndBtn').addEventListener('click',()=>{
  muted=!muted;$('sndBtn').textContent=muted?'♪ OFF':'♪ ON';$('sndBtn').classList.toggle('muted',muted);
  $('sndBtn').setAttribute('aria-label',muted?'Unmute sound':'Mute sound');
  ensureCtx();bgmUpdate();
  if(ctrl&&disco){if(muted)ctrl.pause();else ctrl.play();}
});
function setMin(min){musicEl.classList.toggle('min',min);$('mMin').textContent=min?'♪':'–';$('mMin').setAttribute('aria-label',min?'Open player':'Minimize player');}
$('mMin').addEventListener('click',e=>{e.stopPropagation();setMin(!musicEl.classList.contains('min'));});
musicEl.addEventListener('click',()=>{if(musicEl.classList.contains('min'))setMin(false);});

const K=['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];let kp=0;
addEventListener('keydown',e=>{kp=e.key.toLowerCase()===K[kp]?kp+1:(e.key.toLowerCase()===K[0]?1:0);
  if(kp===K.length){kp=0;disco=document.body.classList.toggle('rainbow');addCoin(30);setDiscoMusic();}});
</script>
